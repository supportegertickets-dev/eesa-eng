services:
  - type: web
    name: eesa-api
    runtime: node
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: FRONTEND_URL
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: BREVO_API_KEY
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        sync: false
      - key: MPESA_CONSUMER_KEY
        sync: false
      - key: MPESA_CONSUMER_SECRET
        sync: false
      - key: MPESA_SHORTCODE
        sync: false
      - key: MPESA_PASSKEY
        sync: false
      - key: MPESA_CALLBACK_URL
        sync: false
      - key: MPESA_ENV
        sync: false
      - key: ISA_HUB_ENABLED
        value: "false"
      - key: ISA_HUB_BASE_URL
        sync: false
      - key: ISA_HUB_API_KEY
        sync: false
      - key: ISA_HUB_WEBHOOK_SECRET
        sync: false
      - key: ISA_HUB_WEBHOOK_TOLERANCE_SECONDS
        value: "300"
      - key: ISA_HUB_TIMEOUT_MS
        value: "15000"
      - key: ISA_HUB_STATUS_CHECK_COOLDOWN_MS
        value: "8000"
      - key: ISA_HUB_RECONCILE_INTERVAL_MS
        value: "60000"
      - key: REGISTRATION_FEE
        sync: false
      - key: RENEWAL_FEE
        sync: false
